services:
  db:
    ports:
      - '5432:5432'

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "npm run build --workspace=@aib-sitac/core && npm run dev --workspace=@aib-sitac/api"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://sitac:sitac_local_only@db:5432/sitac
      PORT: '4000'
      CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/core:/app/packages/core
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
    develop:
      watch:
        - action: restart
          path: ./apps/api/src
        - action: restart
          path: ./apps/api/sql
        - action: restart
          path: ./packages/core/src
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./apps/api/package.json
        - action: rebuild
          path: ./packages/core/package.json
        - action: rebuild
          path: ./package.json

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "npm run build --workspace=@aib-sitac/core && npm run dev:docker --workspace=@aib-sitac/web"
    environment:
      NODE_ENV: development
      API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      PORT: '3000'
      WATCHPACK_POLLING: '1000'
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/core:/app/packages/core
      - web_next_cache:/app/apps/web/.next
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
    develop:
      watch:
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./packages/core/package.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./apps/web/next.config.ts

volumes:
  web_next_cache:
