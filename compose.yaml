services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-sitac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitac_local_only}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${API_PORT:-4000}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - '${API_PORT:-4000}:${API_PORT:-4000}'

  web:
    build:
      context: .
      target: web
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${WEB_PORT:-3000}
      API_URL: http://api:${API_PORT:-4000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-4000}}
    ports:
      - '${WEB_PORT:-3000}:${WEB_PORT:-3000}'

volumes:
  postgres_data:
