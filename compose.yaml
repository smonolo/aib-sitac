services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sitac
      POSTGRES_USER: sitac
      POSTGRES_PASSWORD: sitac_local_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sitac -d sitac']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://sitac:sitac_local_only@db:5432/sitac
      PORT: '4000'
      CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '3000:3000'
    environment:
      API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      PORT: '3000'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
