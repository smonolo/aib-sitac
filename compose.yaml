services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-sitac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitac_local_only}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${API_PORT:-4000}
      WEB_PORT: ${WEB_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgres://sitac:sitac_local_only@db:5432/postgres}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - '${API_PORT:-4000}:${API_PORT:-4000}'
    depends_on:
      db:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||4000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${WEB_PORT:-3000}
      API_URL: http://api:${API_PORT:-4000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-4000}}
    ports:
      - '${WEB_PORT:-3000}:${WEB_PORT:-3000}'
    depends_on:
      api:
        condition: service_healthy
        required: false
    restart: unless-stopped

  tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
        required: false
    restart: unless-stopped

volumes:
  postgres_data:
